[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova3d-mcp"
version = "0.4.0"
description = "Nova3D MCP server — structured, part-aware 3D generation for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "mcp",
    "3d-generation",
    "blender",
    "ai",
    "nova3d",
    "generative-ai",
    "3d-assets",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://nova3d.xyz"
Repository = "https://github.com/RareSense/Nova3D"
"Bug Tracker" = "https://github.com/RareSense/Nova3D/issues"
Documentation = "https://github.com/RareSense/Nova3D/tree/main/mcp#readme"

[project.scripts]
nova3d-mcp = "nova3d_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["nova3d_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
